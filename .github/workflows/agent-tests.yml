name: Agent tests
on:
  pull_request:
    paths:
      - 'backend/invoice-agent-backend/**'
      - '.github/workflows/agent-tests.yml'
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run isolated Agent tests
        working-directory: backend/invoice-agent-backend
        run: bash mvnw -B '-Dtest=InvoiceAuditAgentToolsTest,SpringAiSupervisorAgentServiceTest,AgentToolTraceStoreTest' test
