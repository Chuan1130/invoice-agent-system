spring.application.name=invoice-agent-backend

server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/invoice_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=invoice_agent_backend.entity

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OCR Provider
# mock  = use local mock OCR
# baidu = use Baidu real invoice OCR
ocr.provider=baidu

# Baidu OCR
# Credentials should be provided through environment variables.
# Never commit real API keys into Git.
ocr.baidu.api-key=${BAIDU_OCR_API_KEY:}
ocr.baidu.secret-key=${BAIDU_OCR_SECRET_KEY:}

# Supervisor Agent
# Keep the agent disabled by default so the original audit workflow can run
# without any LLM key. Enable it only when the LLM configuration is ready.
agent.supervisor.enabled=${AGENT_SUPERVISOR_ENABLED:false}

# Spring AI 1.1.x is used because this project is on Spring Boot 3.5.x.
# OpenAI-compatible providers can be switched only through environment variables.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.api-key=${LLM_API_KEY:}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${LLM_MODEL:deepseek-flash}
